        column_name: Fit Research
        lead_scope: subset
        list_id: 9c1f7e2a-4b6d-4f21-9a3e-2b7c8d1e5f04
        max_rows: 100
        overwrite: false
        prompt: "For each lead, research their company's recent funding rounds and\
          \ product launches, then write a 2-sentence summary of why they are a strong\
          \ fit for our sales-automation platform. Only cite facts supported by the\
          \ available lead and company fields."
        quote_id: qte_v1_1751404800_a3f9c8e2b7d14f6a9c0e1b2d3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a
      properties:
        list_id:
          description: "UUID of the lead list the agent runs against. Must be a list\
            \ this API key can access (owned, org-visible, or shared) — a known id\
            \ for a private list in the same org is rejected with 404."
          title: List Id
          type: string
        agent_type:
          default: custom_ai
          description: "Which agent to run. `custom_ai` runs your own `prompt`; `cold_intro_email`\
            \ drafts a personalized opener from an email template. The preset research\
            \ agents (`title_normalizer`, `company_intel`, `pain_point_hypothesis`)\
            \ run a baked-in instruction and ignore `prompt`. All types execute asynchronously\
            \ as an AI smart column."
          enum:
          - custom_ai
          - cold_intro_email
          - title_normalizer
          - company_intel
          - pain_point_hypothesis
          title: Agent Type
          type: string
        prompt:
          nullable: true
          type: string
        column_name:
          description: Display name for the new column that stores each lead's agent
            output for custom/preset agents. Existing completed outputs are preserved
            unless `overwrite=true` is quoted. Cold intro email uses the platform's
            built-in email column.
          maxLength: 100
          minLength: 1
          title: Column Name
          type: string
        template_id:
          nullable: true
          type: string
        lead_scope:
          default: subset
          description: "`subset` runs on up to `max_rows` leads (the fast, cheap path).\
            \ `all` selects the entire list. Any selection above the configured threshold\
            \ (default 500 leads) is blocked with a 400 `approval_required` until\
            \ you narrow scope or route a human approval."
          enum:
          - subset
          - all
          title: Lead Scope
          type: string
        max_rows:
          default: 100
          description: Upper bound on how many leads to process when `lead_scope='subset'`.
            Clamped to the list size. Ignored when `lead_scope='all'`.
          maximum: 10000.0
          minimum: 1.0
          title: Max Rows
          type: integer
        quote_id:
          description: "Single-use spend quote from POST /credits/estimate, signed\
            \ for this exact request shape (list_id + agent_type + column_name + row\
            \ count). It is verified and atomically redeemed before the run starts;\
            \ a stale, mismatched, or already-used quote returns a 400 or 409. Re-quote\
            \ if you change any field."
          title: Quote Id
          type: string
        overwrite:
          default: false
          description: "When true, existing values in a column of the same name are\
            \ overwritten instead of preserved. Included in the signed quote and applied\
            \ while resolving the exact eligible lead IDs."
          title: Overwrite
          type: boolean
      required:
      - column_name
      - list_id
      - quote_id
      title: RunSmartAgentRequest
    RunSmartAgentResponse:
      additionalProperties: false
      description: |-
        Three identifiers can live on this response (T1-6 ID-space rename):

        - `smart_agent_task_id` — canonical id for polling
          `get_smart_agent_results`.
        - `smart_agent_task_ids` — dict keyed by column type when
          `process_smart_columns` returns multiple underlying task ids.
        - `task_id` (from EnvelopeFields) — kept populated for back-compat
          with v1.0 callers that read it from the envelope.

        The three are distinct identifiers. A smart-column run's id is NOT
        an MCP cohort handle, but the envelope still carries `task_id` for
        transitional compat. New callers should read `smart_agent_task_id`.
      example:
        agent_instructions: Run started over 100 leads. Poll GET /smart-agents/run_7c2a91
          every few seconds until status is 'completed'. ~100 credits are deducted
          as rows complete.
        column_name: Fit Research
        estimated_cost: 100
        list_id: 9c1f7e2a-4b6d-4f21-9a3e-2b7c8d1e5f04
        smart_agent_task_id: run_7c2a91
        smart_agent_task_ids:
          custom_ai: run_7c2a91
        status: pending
        task_id: task_9f2c1a
        timestamp_ms: 1751404800000
      properties:
        task_id:
          nullable: true
          type: string
        timestamp_ms:
          nullable: true
          type: integer
        agent_instructions:
          nullable: true
          type: string
        usage:
          nullable: true
          type: string
        message:
          nullable: true
          type: string
        smart_agent_task_id:
          description: "Canonical run id. Pass this to GET /smart-agents/{id} to poll\
            \ progress and per-lead results."
          title: Smart Agent Task Id
          type: string
        smart_agent_task_ids:
          additionalProperties:
            type: string
          description: Underlying task ids keyed by column type. Usually a single
            entry; populated when the run fans out to more than one smart-column task.
          title: Smart Agent Task Ids
        status:
          description: Initial run status; always 'pending' at launch.
          title: Status
          type: string
        list_id:
          description: UUID of the lead list the run was launched against.
          title: List Id
          type: string
        column_name:
          description: Name of the column that will hold each lead's output.
          title: Column Name
          type: string
        estimated_cost:
          description: Credits expected for this run (per-lead rate × row count).
            Actual debit happens as rows complete and may be lower if leads fail.
          title: Estimated Cost
          type: integer
      required:
      - column_name
      - estimated_cost
      - list_id
      - smart_agent_task_id
      - status
      title: RunSmartAgentResponse
