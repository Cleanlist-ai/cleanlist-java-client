      parameters:
      - explode: true
        in: query
        name: folder_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          nullable: true
