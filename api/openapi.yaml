    SingleEnrichmentResultRead:
      additionalProperties: false
      description: |-
        Inline enriched-lead payload for single-workflow polls.

        Populated by `enrich_status` only when the workflow is a single-
        lead `enrich_person` run AND has reached a terminal state. Read
        from the workflow's returned `EnrichmentResult` via Temporal's
        history — no extra DB round-trip, no race with backend visibility.
        Bulk-list runs leave `result=None` on the parent response (the
        aggregate counters carry the cohort's progress instead).

        `status` here is the EnrichmentResult-level outcome
        ("completed" / "failed"), NOT the outer workflow status. Use it
        to distinguish a real enrichment (Lead persisted, lead_id set)
        from a workflow that returned cleanly with no usable Lead (e.g.
        provider cascade exhausted — `lead_id` will be empty).
      example:
        company: Acme
        email: jane@acme.io
        email_status: valid
        enrichment_type: full
        first_name: Jane
        full_name: Jane Doe
        last_name: Doe
        lead_id: lead_4a7c
        linkedin_url: https://www.linkedin.com/in/jane-doe-9a1b
        phone: "+14155550142"
        provider: wiza
        status: completed
        title: VP of Sales
      properties:
        lead_id:
          description: ID of the persisted Lead. Empty when the provider cascade was
            exhausted with no usable result.
          title: Lead Id
          type: string
        status:
          description: "EnrichmentResult-level outcome: 'completed' (lead persisted)\
            \ or 'failed'. Distinct from the outer workflow status."
          title: Status
          type: string
        full_name:
          nullable: true
          type: string
        first_name:
          nullable: true
          type: string
        last_name:
          nullable: true
          type: string
        email:
          nullable: true
          type: string
        email_status:
