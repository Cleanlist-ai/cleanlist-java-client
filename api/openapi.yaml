components:
  schemas:
    AddByCohort:
      additionalProperties: false
      description: |-
        Mode B: materialize a prior search cohort into the list.

        `search_*` rows carry integer search-DB ids (not lead UUIDs), so
        Mode A's `UUID(lead_id)` rejects them — Mode B resolves the cohort by
        `task_id` and creates the lead rows from the task's cached
        `entity_details`.
      example:
        entity_ids:
        - "4482910"
        - "4482911"
        idempotency_key: save-2026-06-28-d4e5f6
        task_id: task_9f2c1a
      properties:
        task_id:
          description: A cohort handle from a prior search_people / list_leads_in_list
            response. Materializes that cohort's entities into this list.
          title: Task Id
          type: string
        entity_ids:
          items:
            type: string
          maxItems: 2000
          nullable: true
          type: array
        idempotency_key:
          maxLength: 128
          nullable: true
          type: string
      required:
      - task_id
      title: AddByCohort
    AddByLeadIds:
      additionalProperties: false
      description: |-
        Mode A: add already-materialized leads by UUID.

        These come from `list_leads_in_list` (real lead UUIDs) or a list
        already owned by the workspace.
      example:
        idempotency_key: add-2026-06-28-a1b2c3
        lead_ids:
        - lead_5f3b8c
        - lead_9d2e71
      properties:
        lead_ids:
          description: Lead UUIDs to add (from list_leads_in_list / an owned list).
          items:
            type: string
          maxItems: 1000
          minItems: 1
          type: array
        idempotency_key:
          maxLength: 128
          nullable: true
          type: string
      required:
      - lead_ids
      title: AddByLeadIds
    AddLeadsResponse:
      additionalProperties: false
      example:
        added: 25
        created: 20
        credits_charged: 12.5
        list_id: list_7c2a91
        skipped_duplicates: 3
      properties:
        list_id:
          description: Identifier of the list leads were added to.
          title: List Id
          type: string
        added:
          description: Number of leads newly inserted into the list (billed rows).
          title: Added
          type: integer
        skipped_duplicates:
          description: Leads already in the list that were skipped (not re-billed).
          title: Skipped Duplicates
          type: integer
        created:
          nullable: true
          type: integer
        credits_charged:
          default: 0
          description: "Import credits charged. Import is free, so this is 0; only\
            \ enrichment is billed (separately)."
          title: Credits Charged
          type: number
      required:
      - added
      - list_id
      - skipped_duplicates
      title: AddLeadsResponse
    ApiKeyInfo:
      additionalProperties: {}
      example:
        created_at: 2026-05-12 09:31:44
        is_active: true
        key_id: ak_5f8c2b91
        key_last4: a4f9
        key_prefix: clapi_
        last_used_at: 2026-06-30 18:02:10
        name: Production server key
        scopes:
        - credits:read
        - search:read
        - enrichment:write
        - admin:api_keys
      properties:
        key_id:
          description: Opaque id of the API key row (safe to display and reference).
          title: Key Id
          type: string
        key_prefix:
          description: "Non-secret leading segment of the key, used for at-a-glance\
            \ identification. Cleanlist keys are `clapi_`."
          title: Key Prefix
          type: string
        key_last4:
          description: Last 4 characters of the key for disambiguation. The full secret
            is never returned by this endpoint.
          title: Key Last4
          type: string
        name:
          nullable: true
          type: string
        scopes:
          description: "Permission scopes carried by this key. Scopes are granted\
            \ per-USER today, so every key the caller owns shares the caller's scopes."
          items:
            nullable: true
            type: string
          type: array
        created_at:
          nullable: true
          type: string
        last_used_at:
          nullable: true
          type: string
        is_active:
          description: Whether the key is currently active. Revoked keys report false.
          title: Is Active
          type: boolean
      required:
      - is_active
      - key_id
      - key_last4
      - key_prefix
      - scopes
      title: ApiKeyInfo
    ApiKeysResponse:
      additionalProperties: false
      example:
        keys:
        - created_at: 2026-05-12 09:31:44
          is_active: true
          key_id: ak_5f8c2b91
          key_last4: a4f9
          key_prefix: clapi_
          last_used_at: 2026-06-30 18:02:10
          name: Production server key
          scopes:
          - credits:read
          - search:read
          - enrichment:write
          - admin:api_keys
      properties:
        keys:
          description: API keys owned by the caller and scoped to the calling token's
            org (prefix + last 4 only — never full secrets). Empty when none exist.
          items:
            $ref: "#/components/schemas/ApiKeyInfo"
          type: array
      required:
      - keys
      title: ApiKeysResponse
