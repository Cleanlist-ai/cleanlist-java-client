          description: Permission denied or feature not enabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Resource not found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Resource conflict.
        "429":
          content:
            application/json:
              schema:
