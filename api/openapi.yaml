    PublicLeadListUpdate:
      additionalProperties: false
      description: |-
        PATCH body for renaming / re-describing / re-filing a list.

        All fields optional but at least one must be supplied. PATCH
        semantics: only the fields PRESENT in the request change. A field
        set to ``null`` clears it (``description``) or unfiles the list
        (``folder_id``); a field omitted entirely is left untouched. The
        omitted-vs-explicit-null distinction is read from
        ``model_fields_set`` in the handler — which is exactly why
        ``extra="forbid"`` matters here: an unknown key would otherwise land
        in that set and be mistaken for a real field change.
      example:
        description: Refocused on Series B+ SaaS in EMEA.
        folder_id: folder_3d9b12
        name: Q3 Enterprise SaaS Leads (EMEA)
      properties:
        name:
          maxLength: 200
          minLength: 1
          nullable: true
          type: string
        description:
          nullable: true
          type: string
        folder_id:
          nullable: true
          type: string
      title: PublicLeadListUpdate
