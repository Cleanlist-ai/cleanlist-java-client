openapi: 3.1.0
info:
  description: "Versioned public API surface (v2) for the Cleanlist MCP and direct\
    \ API consumers: workspace, lead lists, enrichment, smart agents, sync, and export."
  title: Cleanlist API (v2)
  version: 2.0.0
servers:
- description: Production
  url: https://api.cleanlist.ai
- description: Local development
  url: http://localhost:8000
tags:
- description: "Workspace, credits, usage"
  name: Public Workspace
- description: Lead list management
  name: Public Lead Lists
- description: Enrichment operations
  name: Public Enrichment
- description: Find people by filters or find employees by company
  name: Public People Finder
- description: Smart agent runs
  name: Public Smart Agents
- description: Export
  name: Public Export
paths:
  /api/v2/whoami:
    get:
      description: |-
        Introspect the authenticated principal and its effective entitlements.
        Returns the caller's identity (user, org, auth type, scopes) plus the
        resolved plan `tier`, any `appsumo_tier`, and the merged `features` list
        the server-side gates actually enforce — letting clients (and the MCP)
        tier-filter their advertised tools before hitting a gated route. This
        endpoint is free and deducts no credits; for API-key auth the returned
        `user_email` is masked so a leaked key can't reveal the creator's address,
        and display-name lookups are best-effort (null on a transient miss).

        **📖 Docs:** https://docs.cleanlist.ai/api-reference/authentication
      operationId: whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Bad request.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Authentication required or invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Permission denied or feature not enabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Resource not found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Resource conflict.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Rate limited.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Internal error.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Upstream provider error.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiError"
          description: Request failed validation.
      security:
      - HTTPBearer: []
      summary: Get current identity & entitlements
      tags:
      - Public Workspace
      x-accepts:
      - application/json
  /api/v2/credits/balance:
    get:
      description: |-
        Return the current spendable credit balance for the caller's organization.
        Reads the authoritative `organizations.credits_count` and returns it with a
        short `agent_instructions` nudge summarizing remaining credits. Requires the
        `credits:read` scope and deducts no credits itself. Use this before large
        operations, and pair it with `POST /credits/estimate` to confirm a specific
        action is affordable before spending.

        **📖 Docs:** https://docs.cleanlist.ai/api-reference/credits
