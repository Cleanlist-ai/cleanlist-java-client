# Releases the SDK and publishes it to Maven Central every time `main` moves.
#
# The bump comes from Conventional Commits since the last v* tag:
#   feat!: / fix!: / "BREAKING CHANGE:"  -> major
#   feat:                                -> minor
#   fix: / perf:                         -> patch
#   anything else (docs, ci, chore...)   -> no release
#
# The release job writes the new version into the repo (pom.xml, build.gradle,
# Configuration.VERSION, user agent, README snippets, and the generator
# defaults so a regen keeps it), commits `chore(release): vX.Y.Z`, tags it and
# creates a GitHub Release. The publish job then signs that tag and publishes
# it. If publishing fails, re-run just the failed job; the tag and release are
# already in place. Re-running the whole workflow is also safe: it finds the
# tag and picks up from there.
#
# Required repo secrets (see RELEASING.md):
#   CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD  (Portal -> Account -> user token)
#   GPG_PRIVATE_KEY   (armored private key: gpg --armor --export-secret-keys <KEYID>)
#   GPG_PASSPHRASE    (empty string if the key has no passphrase)
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Skip the bump commit this workflow pushes.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          msgs=$(git log "${last_tag:+$last_tag..}HEAD" --pretty=%B)
          if grep -qE '(^|\s)BREAKING CHANGE:|^[a-z]+(\([^)]+\))?!:' <<<"$msgs"; then bump="major"
          elif grep -qE '^feat(\([^)]+\))?:' <<<"$msgs"; then bump="minor"
          elif grep -qE '^(fix|perf)(\([^)]+\))?:' <<<"$msgs"; then bump="patch"
          else
            echo "No feat/fix/perf commits since ${last_tag:-the first commit}; nothing to release."
            exit 0
          fi
          # The project's own <version> is the first one in the pom.
          old=$(grep -m1 -oP '<version>\K[^<]+' pom.xml)
          IFS=. read -r major minor patch <<<"$old"
          case $bump in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
          esac
          echo "$bump: $old -> $new"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          # Re-run after the tag was pushed (the push is atomic, so the bump
          # commit is on main too): skip the bump and finish the release.
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "v$new is already tagged; resuming."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, tag, push
        if: steps.next.outputs.version && !steps.next.outputs.tagged
        env:
          OLD: ${{ steps.next.outputs.old }}
          NEW: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          o=${OLD//./\\.}
          # pom.xml: only the project's own (first) <version>, never a dependency's.
          sed -i "0,/<version>$o<\/version>/s//<version>$NEW<\/version>/" pom.xml
          # Only package-version strings. "The version of the OpenAPI document"
          # headers are the API version and stay as they are.
          git grep -lF "$OLD" -- README.md examples build.gradle scripts src | xargs -r sed -i -E \
            -e "s#<version>$o</version>#<version>$NEW</version>#" \
            -e "s/cleanlist-java([:-])$o/cleanlist-java\1$NEW/g" \
            -e "s/^version = '$o'/version = '$NEW'/" \
            -e "s/\"artifactVersion\": \"$o\"/\"artifactVersion\": \"$NEW\"/" \
            -e "s/ VERSION = \"$o\"/ VERSION = \"$NEW\"/" \
            -e "s#OpenAPI-Generator/$o/#OpenAPI-Generator/$NEW/#" \
            -e "s/PKG_VERSION:-$o\}/PKG_VERSION:-$NEW}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$NEW"
          git tag -a "v$NEW" -m "v$NEW"
          # Atomic: the commit and the tag land together or not at all.
          git push --atomic origin HEAD:main "v$NEW"

      - name: Create GitHub Release
        if: steps.next.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.next.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

  publish:
    needs: release
    if: needs.release.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up JDK 17 + Maven settings
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          # Writes ~/.m2/settings.xml with a <server id="central"> using these env vars:
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          mvn -B -Psign-artifacts -DskipTests -Dmaven.javadoc.failOnError=false
          clean deploy
